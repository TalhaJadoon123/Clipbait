[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipbait"
version = "0.1.0"
description = "Open-source, local-first engine that turns long videos and live streams into high-retention vertical clips."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Clipbait contributors" }]
keywords = ["video", "shorts", "clipping", "opusclip", "whisper", "llm", "ffmpeg", "live"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Local transcription (no cloud key required).
whisper = ["faster-whisper>=1.0.0"]
# Face-aware reframing. Falls back to motion/centre crop when absent.
vision = ["opencv-python-headless>=4.9", "numpy>=1.26"]
# Keyless YouTube live-chat ingestion.
live = ["pytchat>=0.5.8"]
# Blur-pad, split-screen and B-roll helpers.
media = ["Pillow>=10.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "numpy>=1.26"]
all = [
  "faster-whisper>=1.0.0",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "pytchat>=0.5.8",
  "Pillow>=10.0",
]

[project.scripts]
clipbait = "clipbait.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's File()/Query() defaults are the framework idiom, not B008.
"src/clipbait/api/app.py" = ["B008"]