services:
  clipbait:
    build:
      context: .
      dockerfile: Dockerfile
    image: clipbait:local
    container_name: clipbait
    # Run as the host user so the bind-mounted ./data is writable without sudo.
    # Override with CLIPBAIT_UID / CLIPBAIT_GID if your id is not 1000.
    user: "${CLIPBAIT_UID:-1000}:${CLIPBAIT_GID:-1000}"
    ports:
      - "${CLIPBAIT_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Persisted state, not the image layer.
      CLIPBAIT_DATA_DIR: /data
      CLIPBAIT_HOST: 0.0.0.0
      CLIPBAIT_PORT: "8000"
      CLIPBAIT_PUBLIC_BASE_URL: ${CLIPBAIT_PUBLIC_BASE_URL:-http://localhost:8000}
      HOME: /data
    volumes:
      - ./data:/data
    # Media encoding is CPU-heavy; give it priority but never the whole host.
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional local LLM for richer highlight ranking and copy. Enable with:
  #   docker compose --profile llm up
  # Then set CLIPBAIT_LLM_PROVIDER=ollama in .env.
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    container_name: clipbait-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama: